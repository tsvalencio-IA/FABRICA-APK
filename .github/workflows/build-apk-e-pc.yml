name: Build APK Android e Instalador PC

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  android-apk:
    name: Gerar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Preparar www com HTML enviado
        run: npm run prepare:www

      - name: Adicionar Android se necessário
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK Debug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: COMPRESSOR-OFFLINE-ANDROID-APK
          path: android/app/build/outputs/apk/debug/*.apk

  windows-pc:
    name: Gerar instalador Windows PC
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Gerar instalador Windows
        run: npm run pc:win
        env:
          GH_TOKEN: ""

      - name: Enviar instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: COMPRESSOR-OFFLINE-WINDOWS-PC
          path: |
            dist-pc/*.exe
            dist-pc/*.blockmap

  web-pwa:
    name: Gerar pacote Web/PWA
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Compactar src
        run: zip -r COMPRESSOR-OFFLINE-WEB-PWA.zip src README.md package.json capacitor.config.json
      - name: Enviar Web/PWA
        uses: actions/upload-artifact@v4
        with:
          name: COMPRESSOR-OFFLINE-WEB-PWA
          path: COMPRESSOR-OFFLINE-WEB-PWA.zip
